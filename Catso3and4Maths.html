<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATSO 3 and4 Grade Maths Exam Quiz</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #5a67d8;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .question {
            margin: 20px 0;
            padding: 20px;
            background: #f7fafc;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
        }
        
        .question-number {
            font-weight: bold;
            color: #5a67d8;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        .question-text {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #2d3748;
        }
        
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .option {
            padding: 10px 20px;
            background: white;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        
        .option:hover:not(.disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .option.selected {
            background: #48bb78;
            color: white;
            border-color: #48bb78;
        }
        
        .option.wrong {
            background: #f56565;
            color: white;
            border-color: #f56565;
        }
        
        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .result {
            margin-top: 10px;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
        }
        
        .result.correct {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .result.incorrect {
            background: #fed7d7;
            color: #742a2a;
        }
        
        #submitBtn {
            display: block;
            margin: 30px auto;
            padding: 15px 40px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #submitBtn:hover {
            background: #38a169;
            transform: scale(1.05);
        }
        
        #scoreDisplay {
            text-align: center;
            font-size: 2em;
            color: #5a67d8;
            margin-top: 30px;
            padding: 20px;
            background: #e6fffa;
            border-radius: 15px;
            display: none;
        }
        
        .score-text {
            font-size: 0.6em;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 CATSO 3 and 4 Grade Maths Quiz 🎯</h1>
        <div id="quizContainer"></div>
        <button id="submitBtn" onclick="calculateScore()">Submit Quiz</button>
        <div id="scoreDisplay"></div>
    </div>

    <script>
   // All questions data
const allQuestions = [
  // Questions 1-15: Place Value and Number Systems

  { q: "How many total digits are in the number one million?", options: ["5 digits", "6 digits", "7 digits", "8 digits"], answer: "7 digits" },
  { q: "In Roman numerals, which letter represents the number 10?", options: ["V", "X", "L", "C"], answer: "X" },

  { q: "What is the smallest odd prime number?", options: ["1", "3", "5", "7"], answer: "3" },
  { q: "What is the smallest composite number?", options: ["1", "2", "4", "6"], answer: "4" },

  { q: "Numbers obtained by multiplying a given whole number by counting numbers (1, 2, 3...) are its:", options: ["Factors", "Multiples", "Divisors", "Fractions"], answer: "Multiples" },

  { q: "A whole number is completely divisible by 5 if its ones digit is:", options: ["0 or 2", "0 or 5", "1 or 5", "5 or 9"], answer: "0 or 5" },

        let selectedQuestions = [];
        let answeredQuestions = new Set();
        let score = 0;

        // Shuffle array and get 30 random questions
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, 30);
        }

        // Initialize quiz
        function initializeQuiz() {
            selectedQuestions = shuffleArray(allQuestions);
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            selectedQuestions.forEach((question, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.id = `question-${index}`;

                const questionNumber = document.createElement('div');
                questionNumber.className = 'question-number';
                questionNumber.textContent = `Question ${index + 1}`;

                const questionText = document.createElement('div');
                questionText.className = 'question-text';
                questionText.textContent = question.q;

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                question.options.forEach((option, optionIndex) => {
                    const optionBtn = document.createElement('button');
                    optionBtn.className = 'option';
                    optionBtn.textContent = `${String.fromCharCode(65 + optionIndex)}) ${option}`;
                    optionBtn.onclick = () => selectAnswer(index, option, optionBtn);
                    optionsDiv.appendChild(optionBtn);
                });

                const resultDiv = document.createElement('div');
                resultDiv.className = 'result';
                resultDiv.id = `result-${index}`;
                resultDiv.style.display = 'none';

                questionDiv.appendChild(questionNumber);
                questionDiv.appendChild(questionText);
                questionDiv.appendChild(optionsDiv);
                questionDiv.appendChild(resultDiv);
                container.appendChild(questionDiv);
            });
        }

        // Handle answer selection
        function selectAnswer(questionIndex, selectedAnswer, buttonElement) {
            if (answeredQuestions.has(questionIndex)) return;

            answeredQuestions.add(questionIndex);
            const question = selectedQuestions[questionIndex];
            const options = buttonElement.parentElement.querySelectorAll('.option');
            const resultDiv = document.getElementById(`result-${questionIndex}`);

            // Disable all options for this question
            options.forEach(option => {
                option.classList.add('disabled');
                option.onclick = null;
            });

            // Show correct/incorrect styling
            if (selectedAnswer === question.answer) {
                buttonElement.classList.add('selected');
                resultDiv.textContent = '✅ Correct!';
                resultDiv.className = 'result correct';
                score++;
            } else {
                buttonElement.classList.add('wrong');
                resultDiv.textContent = `❌ Incorrect. Correct answer: ${question.answer}`;
                resultDiv.className = 'result incorrect';
                
                // Highlight correct answer
                options.forEach(option => {
                    if (option.textContent.includes(question.answer)) {
                        option.classList.add('selected');
                    }
                });
            }

            resultDiv.style.display = 'block';
        }

        // Calculate and display score
        function calculateScore() {
            const submitBtn = document.getElementById('submitBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');
            
            submitBtn.style.display = 'none';
            
            let message = '';
            let emoji = '';
            
            if (score === 30) {
                message = 'Perfect Score!';
                emoji = '🏆';
            } else if (score >= 25) {
                message = 'Excellent!';
                emoji = '🌟';
            } else if (score >= 20) {
                message = 'Good Job!';
                emoji = '👏';
            } else if (score >= 15) {
                message = 'Well Done!';
                emoji = '👍';
            } else {
                message = 'Keep Practicing!';
                emoji = '📚';
            }
            
            scoreDisplay.innerHTML = `
                <div style="font-size: 1.5em; margin-bottom: 10px;">${emoji} ${message}</div>
                <div style="font-size: 2.5em; font-weight: bold; color: #48bb78;">${score}/30</div>
                <div class="score-text">Score: ${Math.round((score/30)*100)}%</div>
                <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 30px; background: #667eea; color: white; border: none; border-radius: 25px; font-size: 1.1em; cursor: pointer;">Try Again</button>
            `;
            scoreDisplay.style.display = 'block';
        }

        // Initialize quiz on page load
        window.onload = initializeQuiz;
    </script>
